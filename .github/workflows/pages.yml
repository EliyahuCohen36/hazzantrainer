# Builds the site and publishes it to GitHub Pages on every push to main.
# Free, no build credits: https://eliyahucohen36.github.io/hazzantrainer/
name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /hazzantrainer
          # Accounts (Supabase). Both values are public by design; access is enforced
          # by the security rules in supabase/schema.sql.
          NEXT_PUBLIC_SUPABASE_URL: https://mjjdyfnfadjvdabmgzxf.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_oQnTujjrG97RcUXDOCMJ2g_BmKZe95A
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
